name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build App
        run: |
          # 1. إنشاء مشروع فلاتر نظيف
          flutter create --project-name=auragrand my_app
          
          # 2. نسخ ملف الكود الخاص بك
          if [ -f lib/main.dart ]; then
            cp lib/main.dart my_app/lib/main.dart
          elif [ -f main.dart ]; then
            cp main.dart my_app/lib/main.dart
          fi

          # 3. البناء بصيغة Debug لتخطي أخطاء التوقيع والـ Gradle
          cd my_app
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraGrand-APK
          path: my_app/build/app/outputs/flutter-apk/app-debug.apk
