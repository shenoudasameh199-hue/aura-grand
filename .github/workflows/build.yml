name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create and Build App
        run: |
          flutter create --project-name auragrand app_temp
          if [ -f lib/main.dart ]; then
            cp lib/main.dart app_temp/lib/main.dart
          elif [ -f main.dart ]; then
            cp main.dart app_temp/lib/main.dart
          fi
          cd app_temp
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraGrand-APK
          path: app_temp/build/app/outputs/flutter-apk/app-debug.apk
