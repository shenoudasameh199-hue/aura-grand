name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Files
        run: |
          mkdir -p lib
          if [ -f lib/main.dart ]; then
            cp lib/main.dart main_backup.dart
          fi
          flutter create . --project-name=aura_grand --platforms=android --overwrite
          if [ -f main_backup.dart ]; then
            cp main_backup.dart lib/main.dart
            rm main_backup.dart
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-grand-apk
          path: build/app/outputs/flutter-apk/app-release.apk
