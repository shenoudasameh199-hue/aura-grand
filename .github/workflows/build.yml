name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean App & Build
        run: |
          # 1. إنشاء مشروع فلاتر مجاني ونظيف في مجلد مؤقت
          flutter create --project-name=auragrand temp_app
          
          # 2. نقل ملف الكود الخاص بك داخل المشروع الجديد
          cp lib/main.dart temp_app/lib/main.dart
          
          # 3. بناء تطبيق الـ APK
          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraGrand-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
