name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Android safely without losing main.dart
        run: |
          if [ ! -d "android" ]; then
            mkdir -p temp_backup
            cp lib/main.dart temp_backup/main.dart
            flutter create . --platforms=android
            cp temp_backup/main.dart lib/main.dart
            rm -rf temp_backup
          fi

      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
